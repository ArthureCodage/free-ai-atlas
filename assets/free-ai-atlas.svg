<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Free AI Atlas</title>
  <desc id="desc">A luminous atlas grid surrounding a central AI compass.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1024"/>
      <stop offset="1" stop-color="#171132"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66e3c4"/>
      <stop offset="0.5" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#f2bc57"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9286d8" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <g transform="translate(170 180)" filter="url(#glow)">
    <circle r="103" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".9"/>
    <circle r="76" fill="#12142d" stroke="#8679e8" stroke-width="2"/>
    <path d="M0-62 18-18 62 0 18 18 0 62-18 18-62 0-18-18Z" fill="url(#accent)"/>
    <circle r="15" fill="#0d1025" stroke="#fff" stroke-opacity=".7"/>
    <g fill="#66e3c4">
      <circle cx="0" cy="-116" r="5"/><circle cx="116" cy="0" r="5"/><circle cx="0" cy="116" r="5"/><circle cx="-116" cy="0" r="5"/>
    </g>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="340" y="164" fill="#f8f7ff" font-size="76" font-weight="800" letter-spacing="-3">FREE AI ATLAS</text>
    <text x="345" y="220" fill="#b9b6d4" font-size="25" letter-spacing="2">VERIFIED PATHS TO ZERO-COST AI</text>
    <rect x="345" y="252" width="430" height="3" rx="2" fill="url(#accent)"/>
  </g>
</svg>
